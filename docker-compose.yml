services:
  nginx:
    image: gunk1n/lookingglass-nginx:1   #hybula/lookingglass-nginx:1
    container_name: lg-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    network_mode: host
    restart: unless-stopped

  php-fpm:
    image: gunk1n/lookingglass-php:1   #hybula/lookingglass-php:1
    container_name: lg-php
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect localhost:9000 >/dev/null 2>&1 || exit 1"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    environment:
      # For a better reference as to what these variables do, check out 'config.dist.php' or 'docker/php-fpm/src/config.php'.
      # Please replace them with values that are relevant to your situation!
      LOCATION: Location
      FACILITY: Facility
      FACILITY_URL: https://lookingglass.app.gunk1n.dev/ # http://localhost/
      LOGO_URL: https://github.com/gunk1n/lookingglass-docker/
      LOGO: '<h2 style="color: #000000;">infra.gunk1n.dev | Looking Glass</h2>'
      LOGO_DARK: '<h2 style="color: #ffffff;">infra.gunk1n.dev | Looking Glass</h2>'
      IPV4_ADDRESS: 127.0.0.1
      IPV6_ADDRESS: ::1
      MAPS_QUERY: Moscow
      # Pass these variables with any arbitrary value to disable the respective block.
      # DISABLE_BLOCK_NETWORK: 'true'
      # DISABLE_BLOCK_LOOKINGGLASS: 'true'
      # DISABLE_BLOCK_SPEEDTEST: 'true'
      # Uncomment to enable the custom block, which you can use to add something custom to the LG.
      # ENABLE_CUSTOM_BLOCK: 'true'
      # Uncomment if you require visitors to accept the Terms of Use; the value should be a link to the terms.
      # LG_TERMS: http://localhost/
      # Comma-separated list of enabled methods (default: all methods enabled).
      # METHODS: ping,ping6,mtr,mtr6,traceroute,traceroute6
      # Comma-separated "Label|URL" pairs for other looking glass locations (default: none).
      # LOCATIONS: "Amsterdam|https://ams.lg.example.com,Frankfurt|https://fra.lg.example.com"
      # Comma-separated "Label|URL" pairs for speedtest files (default: none).
      # SPEEDTEST_FILES: "100MB|https://example.com/100mb.bin,1GB|https://example.com/1gb.bin"

